# ─── Production Profile ───────────────────────────────────────────────────────
# This profile is active on Render via SPRING_PROFILES_ACTIVE=prod env var

# ─── Database (Aiven MySQL) ───────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SELECT 1

# ─── JPA — SAFE for production (does NOT drop/recreate tables) ───────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Mail (Brevo SMTP) ────────────────────────────────────────────────────────
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Disable mail health check — prevents /actuator/health from timing out
management.health.mail.enabled=false

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.hivenet=INFO

# ─── Actuator (health check for Render) ──────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
