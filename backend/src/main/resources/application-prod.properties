# ─── Production Profile ───────────────────────────────────────────────────────
# This profile is active on Render via SPRING_PROFILES_ACTIVE=prod env var

# ─── Database (Aiven MySQL) ───────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SELECT 1

# ─── JPA — SAFE for production (does NOT drop/recreate tables) ───────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Mail (Brevo REST API — SMTP blocked on Render free tier) ────────────────
brevo.api.key=${BREVO_API_KEY}

# Disable mail health check
management.health.mail.enabled=false

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.hivenet=INFO

# ─── Actuator (health check for Render) ──────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
